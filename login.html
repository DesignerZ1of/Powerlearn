<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8745727009154154"
     crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Power Learn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:18px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:85px;
    margin-bottom:10px;
}

.logo h1{
    font-size:28px;
    margin-bottom:5px;
}

.logo p{
    color:#94a3b8;
    font-size:14px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
}

.form-group input{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    font-size:15px;
}

.form-group input:focus{
    outline:2px solid #3b82f6;
}

.btn-login{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e09812;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn-login:hover{
    background:#c2810a;
}

.divisor{
    display:flex;
    align-items:center;
    margin:22px 0;
}

.divisor::before,
.divisor::after{
    content:"";
    flex:1;
    height:1px;
    background:#475569;
}

.divisor span{
    padding:0 12px;
    color:#94a3b8;
}

.google{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:white;
    color:#222;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.google img{
    width:22px;
}

.links{
    margin-top:22px;
    text-align:center;
}

.links a{
    color:#60a5fa;
    text-decoration:none;
}

.links p{
    margin-top:12px;
}

</style>



</head>

<body>

<div class="container">

<div class="card">

<div class="logo">

<img src="Arquivos/PowerLearnLogo.png">

<h1>Power Learn</h1>

<p>Aprenda. Pratique. Evolua.</p>

</div>

<h2>Entrar na sua conta</h2>

<form action="/login" method="POST">

<div class="form-group">
<label>E-mail</label>
<input
type="email"
name="email"
placeholder="Digite seu e-mail"
required>
</div>

<div class="form-group">
<label>Senha</label>
<input
type="password"
name="senha"
placeholder="Digite sua senha"
required>
</div>

<button class="btn-login" type="submit">
Entrar
</button>

<div class="divisor">
<span>ou</span>
</div>

<button class="google" type="button">

<img src="Arquivos/googlelogo.png">

Entrar com Google

</button>

<div class="links">

<a href="RecuperarSenha.html">
Esqueci minha senha
</a>

<p>

Não possui uma conta?

<a href="index.html" style="color: orange;">

Criar conta

</a>

</p>

</div>

</form>

</div>

</div>

<script>

// Foco automático no campo de e-mail
window.onload = function(){
    document.querySelector("input[name='email']").focus();
};

// Mensagem enquanto envia o formulário
const formulario = document.querySelector("form");

formulario.addEventListener("submit", function(){

    const botao = document.querySelector(".btn-login");

    botao.innerHTML = "Entrando...";
    botao.disabled = true;

});

</script>



</body>
</html>
